name: Sync School Menu to Calendar

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment whose secrets to use
        required: true
        type: environment
jobs:
  sync-menu:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'wilder' }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Google OAuth token
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          if [ -z "$GOOGLE_TOKEN_JSON" ]; then
            echo "::error::Missing GOOGLE_TOKEN_JSON secret in the selected environment."
            exit 1
          fi
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json
          python -c "import json; json.load(open('token.json', encoding='utf-8'))"
      
      - name: Run menu sync
        env:
          MENU_SCHOOL_SLUG: ${{ secrets.MENU_SCHOOL_SLUG }}
          MENU_CALENDAR_ID: ${{ secrets.MENU_CALENDAR_ID }}
          MENU_TITLE_BREAKFAST: ${{ secrets.MENU_TITLE_BREAKFAST }}
          MENU_TITLE_LUNCH: ${{ secrets.MENU_TITLE_LUNCH }}
          MENU_MAX_WEEKS: ${{ secrets.MENU_MAX_WEEKS }}
          MENU_MIN_COMMAS: ${{ secrets.MENU_MIN_COMMAS }}
        run: |
          python getmenu.py