name: Sync School Menu to Calendar

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      school_slug:
        description: Nutrislice school slug
        required: true
        type: choice
        options:
          - wilder
      calendar_id:
        description: Google Calendar ID
        required: true
        type: string
jobs:
  sync-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run menu sync
        env:
          MENU_SCHOOL_SLUG: ${{ inputs.school_slug || secrets.MENU_SCHOOL_SLUG }}
          MENU_CALENDAR_ID: ${{ inputs.calendar_id || secrets.MENU_CALENDAR_ID }}
          MENU_TITLE_BREAKFAST: ${{ secrets.MENU_TITLE_BREAKFAST }}
          MENU_TITLE_LUNCH: ${{ secrets.MENU_TITLE_LUNCH }}
          MENU_MAX_WEEKS: ${{ secrets.MENU_MAX_WEEKS }}
          MENU_MIN_COMMAS: ${{ secrets.MENU_MIN_COMMAS }}
        run: |
          python getmenu.py